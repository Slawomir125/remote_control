services:
  master:
    build: .
    restart: unless-stopped
    environment:
      MASTER_HOST: 0.0.0.0
      MASTER_PORT: 9000
      MASTER_PANEL_HOST: 0.0.0.0
      MASTER_PANEL_PORT: 8080
      MASTER_DATA_DIR: /data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8080:8080"
    volumes:
      - master_data:/data
      - ./macros:/app/macros:ro

volumes:
  master_data:
